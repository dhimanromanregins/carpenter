# Reverse proxy for the FastAPI backend.
# Copy to /etc/nginx/sites-available/dhiman-backend, symlink into sites-enabled,
# then run `sudo certbot --nginx -d api.dhimaninteriors.in` to add HTTPS
# (certbot rewrites this file to add the SSL server block automatically).

server {
    listen 80;
    server_name api.dhimaninteriors.in;

    # PDF quotations can run a few hundred KB; keep body size generous.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
