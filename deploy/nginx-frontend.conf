# Serves the built React app (Vite output in dist/) as static files.
# Copy to /etc/nginx/sites-available/dhiman-frontend, symlink into sites-enabled,
# then run `sudo certbot --nginx -d dhimaninteriors.in -d www.dhimaninteriors.in`
# to add HTTPS (certbot rewrites this file to add the SSL server block automatically).

server {
    listen 80;
    server_name dhimaninteriors.in www.dhimaninteriors.in;

    root /home/sahildhiman98765/carpenter/dist;
    index index.html;

    # Serve the file if it exists (JS/CSS/images, the design-studio*.html tool
    # pages, robots.txt, sitemap.xml), otherwise fall back to index.html so
    # React Router can handle the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
